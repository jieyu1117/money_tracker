<!DOCTYPE html>
<html>
<head>
    <title>Money Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="layout">

        <!-- Sidebar -->
        <aside class="sidebar">

            <h2>💰 Money Tracker</h2>

            <nav>
                <a href="./index.html">🏠 Dashboard</a>
                <a href="./add-transaction.html">➕ Add Transaction</a>
                <a href="./summary.html">📊 Summary</a>
            </nav>

        </aside>


        <!-- Main Content -->
        <main class="main-content">

            <div class="container">

                <h1>💰 Money Tracker</h1>

                <div class="summary">

                    <div class="card">
                        <h3>Balance</h3>
                        <p id="balance">RM 0.00</p>
                    </div>

                    <div class="card">
                        <h3>Income</h3>
                        <p id="income">RM 0.00</p>
                    </div>

                    <div class="card">
                        <h3>Expense</h3>
                        <p id="expense">RM 0.00</p>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <script src="script.js"></script>

</body>
</html>
